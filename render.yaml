services:
  - type: web
    name: voeq-api
    runtime: node
    plan: free
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @voeq/api prisma:generate && pnpm --filter @voeq/shared build && pnpm --filter @voeq/ui build && pnpm --filter @voeq/api build
    startCommand: cd ../.. && pnpm --filter @voeq/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: true
      - key: NEXTAUTH_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SIGHTENGINE_USER
        sync: false
      - key: SIGHTENGINE_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: IMPERSONATION_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
    autoDeploy: true

